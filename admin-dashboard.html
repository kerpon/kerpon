<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理看板 - kerpon</title>
    <link rel="stylesheet" href="admin-styles.css">
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="generate-form-data.js"></script>
    <script src="insert-form-data.js"></script>
</head>
<body>
    <!-- 密码验证界面 -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="login-content">
                <div class="login-logo">
                    <div class="logo-text">kerpon</div>
                    <div class="logo-subtitle">管理看板</div>
                </div>
                <h2 class="login-title">管理员登录</h2>
                <p class="login-subtitle">请输入密码以访问管理后台</p>
                <form id="login-form">
                    <div class="form-group">
                        <input type="password" id="admin-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">登录</span>
                        <span class="btn-icon">→</span>
                    </button>
                    <p class="login-note">密码错误将无法访问</p>
                </form>
            </div>
        </div>
    </div>

    <!-- 管理看板界面 -->
    <div id="dashboard-screen" class="dashboard-screen" style="display: none;">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">kerpon管理看板</div>
                <div class="nav-actions">
                    <button id="refresh-btn" class="btn btn-secondary">
                        <span class="btn-icon">↻</span>
                        <span>刷新数据</span>
                    </button>
                    <button id="generate-data-btn" class="btn btn-primary">
                        <span class="btn-icon">🔄</span>
                        <span>生成数据</span>
                    </button>
                    <button id="logout-btn" class="btn btn-danger">
                        <span class="btn-icon">✕</span>
                        <span>退出登录</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- 统计卡片 -->
        <section class="stats-section">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-info">
                            <div class="stat-number" id="total-submissions">0</div>
                            <div class="stat-label">总提交数</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📅</div>
                        <div class="stat-info">
                            <div class="stat-number" id="today-submissions">0</div>
                            <div class="stat-label">今日提交</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🏢</div>
                        <div class="stat-info">
                            <div class="stat-number" id="company-submissions">0</div>
                            <div class="stat-label">企业客户</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📈</div>
                        <div class="stat-info">
                            <div class="stat-number" id="conversion-rate">0%</div>
                            <div class="stat-label">转化率</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 数据表格 -->
        <section class="data-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">表单提交记录</h2>
                    <div class="filter-controls">
                        <input type="text" id="search-input" placeholder="搜索姓名、邮箱或公司...">
                        <select id="filter-industry">
                            <option value="">所有行业</option>
                            <option value="tech">科技/互联网</option>
                            <option value="finance">金融</option>
                            <option value="retail">零售/电商</option>
                            <option value="manufacturing">制造业</option>
                            <option value="service">服务业</option>
                            <option value="education">教育</option>
                            <option value="healthcare">医疗健康</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>姓名</th>
                                <th>联系方式</th>
                                <th>公司</th>
                                <th>行业</th>
                                <th>业务类型</th>
                                <th>提交时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-table-body">
                            <tr>
                                <td colspan="8" class="loading-row">
                                    <div class="loading-spinner"></div>
                                    <p>加载数据中...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pagination">
                    <button id="prev-page" class="pagination-btn" disabled>上一页</button>
                    <span class="page-info">第 <span id="current-page">1</span> 页</span>
                    <button id="next-page" class="pagination-btn" disabled>下一页</button>
                </div>
            </div>
        </section>

        <!-- 详情模态框 -->
        <div id="detail-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>详细信息</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- 动态内容 -->
                </div>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
